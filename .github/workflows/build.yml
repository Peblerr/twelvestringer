name: Build TwelveStringer

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4 --target TwelveStringer_VST3

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel 4 --target TwelveStringer_VST3 TwelveStringer_AU

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/TwelveStringer_artefacts/Release/VST3/TwelveStringer.vst3 dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/TwelveStringer_artefacts/Release/AU/TwelveStringer.component dist/
            codesign --force --deep -s - dist/TwelveStringer.vst3
            codesign --force --deep -s - dist/TwelveStringer.component
            cd dist && zip -r -y "../TwelveStringer-${{ matrix.name }}.zip" .
          else
            cd dist && 7z a "../TwelveStringer-${{ matrix.name }}.zip" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TwelveStringer-${{ matrix.name }}
          path: dist

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "TwelveStringer-${{ matrix.name }}.zip" --clobber
